name: Daily prediction runner

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  prediction-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run daily prediction runner on Render
        env:
          PREDICTION_DAILY_TOKEN: ${{ secrets.PREDICTION_DAILY_TOKEN }}
        run: >
          curl --fail-with-body --silent --show-error
          --connect-timeout 120 --max-time 900
          --request POST
          --header "Authorization: Bearer ${PREDICTION_DAILY_TOKEN}"
          --header "Content-Type: application/json"
          --data "{}"
          "https://amen-backend.onrender.com/api/v1/admin/prediction-daily/run"
