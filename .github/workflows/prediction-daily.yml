name: Daily prediction runner

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  prediction-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run daily prediction runner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
          SPORTYBET_BASE_URL: https://www.sportybet.com
          SPORTYBET_SHARE_PATH: /api/ng/orders/share
          SPORTYBET_UPCOMING_PATH: /api/ng/factsCenter/pcUpcomingEvents
          SPORTYBET_UPCOMING_FALLBACK_PATH: /api/ng/factsCenter/wapConfigurableEventsByOrder
          SPORTYBET_FOOTBALL_SPORT_ID: sr:sport:1
          SPORTYBET_UPCOMING_MARKET_IDS: "1,18,10,29,11,26,36,14,60100"
          SPORTYBET_UPCOMING_PAGE_SIZE: "100"
          SPORTYBET_UPCOMING_MAX_PAGES: "100"
          SPORTYBET_TIMEOUT: "20"
          SPORTYBET_WAP_USER_AGENT: "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          SPORTYBET_ACQUISITION_TTL_SECONDS: "300"
        run: python -m app.prediction_daily_runner
